name: Feature request
description: Propose an improvement or a new capability
title: "feat: "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The change you would like. Sketches, API shapes or UI mockups are welcome.
    validations:
      required: true
  - type: textarea
    id: evaluation
    attributes:
      label: How would we measure it?
      description: |
        For retrieval or ranking changes: which metric should move (MRR@5, NDCG@5, Recall@5,
        latency), and on which query category? Retrieval changes ship with benchmark numbers.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to implement it?
      options:
        - "Yes"
        - "Maybe, with guidance"
        - "No"
