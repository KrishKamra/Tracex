[project]
name = "tracex-backend"
version = "0.1.0"
description = "Tracex: AST-aware hybrid NLP codebase semantic search and dependency intelligence engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-typescript>=0.23",
    "numpy>=1.26",
    "sentence-transformers>=3.0",
    "transformers>=4.44,<5",
    "networkx>=3.7",
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0",
    "ruff>=0.17.2",
]
docs = [
    "matplotlib>=3.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: downloads and runs a real embedding model (opt-in via TRACEX_RUN_SLOW=1)"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["tests/fixtures", "eval/corpora"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
