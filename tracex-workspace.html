<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tracex — Context-Adaptive Workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap">
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script>
  if (window.tailwind) tailwind.config = {
    theme: {
      extend: {
        colors: {
          bg: 'rgb(var(--bg) / <alpha-value>)',
          panel: 'rgb(var(--panel) / <alpha-value>)',
          card: 'rgb(var(--card) / <alpha-value>)',
          line: 'rgb(var(--line) / <alpha-value>)',
          ink: 'rgb(var(--ink) / <alpha-value>)',
          sub: 'rgb(var(--sub) / <alpha-value>)',
          muted: 'rgb(var(--muted) / <alpha-value>)',
          mint: 'rgb(var(--mint) / <alpha-value>)',
          trace: 'rgb(var(--trace) / <alpha-value>)'
        },
        fontFamily: {
          sans: ['Inter', 'system-ui', 'sans-serif'],
          mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace']
        }
      }
    }
  };
</script>
<style>
  :root, [data-theme="dark"] {
    --bg: 11 15 23;        /* #0B0F17 */
    --panel: 13 18 29;     /* #0D121D */
    --card: 19 27 46;      /* #131B2E */
    --line: 30 41 59;      /* #1E293B */
    --ink: 226 232 240;
    --sub: 148 163 184;
    --muted: 100 116 139;  /* #64748B */
    --mint: 16 185 129;    /* #10B981 */
    --trace: 56 189 248;
    --violet: 167 139 250;
    --tk-default: #d6dde8; --tk-kw: #c4a7ff; --tk-str: #e9d8a6; --tk-com: #718096;
    --tk-def: #34d399; --tk-type: #f0c674; --tk-self: #f0a6c8; --tk-num: #f4a261;
    --tk-deco: #67d4e8; --tk-fn: #8ecbf0; --tk-bi: #6fd3c6; --tk-p: #8a97ab;
    color-scheme: dark;
  }
  [data-theme="light"] {
    --bg: 247 248 250;
    --panel: 255 255 255;
    --card: 241 245 249;
    --line: 226 232 240;
    --ink: 15 23 42;
    --sub: 71 85 105;
    --muted: 100 116 139;
    --mint: 5 150 105;
    --trace: 2 132 199;
    --violet: 124 58 237;
    --tk-default: #1e293b; --tk-kw: #7c3aed; --tk-str: #a16207; --tk-com: #64748b;
    --tk-def: #047857; --tk-type: #b45309; --tk-self: #be185d; --tk-num: #c2410c;
    --tk-deco: #0e7490; --tk-fn: #0369a1; --tk-bi: #0f766e; --tk-p: #64748b;
    color-scheme: light;
  }
  html, body { height: 100%; }
  body { margin: 0; background: rgb(var(--bg)); color: rgb(var(--ink)); -webkit-font-smoothing: antialiased; }
  :focus-visible { outline: 2px solid rgb(var(--mint)); outline-offset: 2px; border-radius: 6px; }
  ::placeholder { color: rgb(var(--muted)); }

  /* scrollbars */
  .scroll { scrollbar-width: thin; scrollbar-color: rgb(var(--line)) transparent; }
  .scroll::-webkit-scrollbar { width: 10px; height: 10px; }
  .scroll::-webkit-scrollbar-thumb { background: rgb(var(--line)); border-radius: 10px; border: 3px solid transparent; background-clip: padding-box; }
  .scroll::-webkit-scrollbar-thumb:hover { background: rgb(var(--muted) / .6); background-clip: padding-box; border: 3px solid transparent; }
  .scroll::-webkit-scrollbar-track, .scroll::-webkit-scrollbar-corner { background: transparent; }

  /* panels */
  .side { transition: width .32s cubic-bezier(.2,.8,.2,1); }
  .side .full { transition: opacity .2s ease; }
  .side .rail { transition: opacity .2s ease; }
  .side[data-open="true"] .rail { opacity: 0; pointer-events: none; }
  .side[data-open="false"] .full { opacity: 0; pointer-events: none; }

  /* code */
  .tk-kw{color:var(--tk-kw)} .tk-str{color:var(--tk-str)} .tk-com{color:var(--tk-com);font-style:italic}
  .tk-def{color:var(--tk-def);font-weight:600} .tk-type{color:var(--tk-type)} .tk-self{color:var(--tk-self);font-style:italic}
  .tk-num{color:var(--tk-num)} .tk-deco{color:var(--tk-deco)} .tk-fn{color:var(--tk-fn)} .tk-bi{color:var(--tk-bi)} .tk-p{color:var(--tk-p)}
  .code-line { height: 24px; line-height: 24px; display: flex; position: relative; z-index: 1; }
  .code-line .num { width: 64px; flex-shrink: 0; text-align: right; padding-right: 22px; color: rgb(var(--muted) / .55); user-select: none; font-size: 11.5px; transition: color .3s ease; }
  .code-line.on .num { color: rgb(var(--mint) / .9); }
  .code-line.on.trace .num { color: rgb(var(--trace) / .9); }
  .code-line .src { white-space: pre; padding-right: 48px; color: var(--tk-default); }
  .hl-band { position: absolute; left: 10px; right: 10px; border-radius: 8px; background: rgb(var(--mint) / .075); box-shadow: inset 0 0 0 1px rgb(var(--mint) / .14); pointer-events: none; transition: top .38s cubic-bezier(.2,.8,.2,1), height .38s cubic-bezier(.2,.8,.2,1), background .3s ease, box-shadow .3s ease; z-index: 0; }
  .hl-band::before { content: ""; position: absolute; left: 0; top: 6px; bottom: 6px; width: 2px; border-radius: 2px; background: rgb(var(--mint)); box-shadow: 0 0 10px rgb(var(--mint) / .6); transition: background .3s ease; }
  .hl-band.trace { background: rgb(var(--trace) / .07); box-shadow: inset 0 0 0 1px rgb(var(--trace) / .16); }
  .hl-band.trace::before { background: rgb(var(--trace)); box-shadow: 0 0 10px rgb(var(--trace) / .55); }
  .code-fade { animation: fade .28s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }

  /* hover pill */
  .hover-pill { opacity: 0; transform: translateY(4px); transition: opacity .2s ease, transform .2s ease, top .38s cubic-bezier(.2,.8,.2,1); pointer-events: none; }
  .code-wrap:hover .hover-pill, .hover-pill.peek, .hover-pill:focus-within { opacity: 1; transform: none; pointer-events: auto; }
  @media (hover: none) { .hover-pill { opacity: 1; transform: none; pointer-events: auto; } }

  /* results */
  .hit { transition: background .2s ease, border-color .2s ease; }
  .hit[aria-current="true"] { background: rgb(var(--card)); border-left-color: rgb(var(--mint)); }
  .hit[aria-current="true"] .hit-name { color: rgb(var(--ink)); }
  .list-fade { animation: fade .25s ease; }

  /* graph */
  .gnode { cursor: pointer; outline: none; }
  .gnode rect { fill: rgb(var(--card)); stroke: rgb(var(--line)); stroke-width: 1; transition: stroke .2s ease, fill .2s ease; }
  .gnode:hover rect, .gnode:focus-visible rect { stroke: rgb(var(--sub) / .55); }
  .gnode.ext rect { stroke-dasharray: 3 3; }
  .gnode.sel rect { stroke: rgb(var(--trace)); fill: rgb(var(--trace) / .08); }
  .gnode.focus rect { stroke: rgb(var(--mint)); fill: rgb(var(--mint) / .09); }
  .gnode .lbl { fill: rgb(var(--ink)); font: 500 11.5px "JetBrains Mono", monospace; }
  .gnode.focus .lbl { font-size: 13px; }
  .gnode .sub { fill: rgb(var(--muted)); font: 400 10px "JetBrains Mono", monospace; }
  [data-theme="dark"] .gnode .sub { fill: rgb(var(--sub) / .75); }
  .edge { fill: none; stroke: rgb(var(--line)); stroke-width: 1.25; transition: stroke .25s ease; }
  .edge.on { stroke: rgb(var(--mint) / .55); }
  .edge.trace { stroke: rgb(var(--trace) / .8); }
  .edge-dot { fill: rgb(var(--line)); transition: fill .25s ease; }
  .edge-dot.on { fill: rgb(var(--mint) / .7); }
  .edge-dot.trace { fill: rgb(var(--trace)); }
  .graph-fade { animation: fade .3s ease; }
  .breathe { animation: breathe 3.6s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: .55; } }

  /* popovers */
  .pop { opacity: 0; transform: translateY(6px) scale(.98); pointer-events: none; transition: opacity .18s ease, transform .18s ease; }
  .pop[data-open="true"] { opacity: 1; transform: none; pointer-events: auto; }
  .glass { background: rgb(var(--panel) / .86); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }

  .switch { width: 30px; height: 18px; border-radius: 999px; background: rgb(var(--line)); position: relative; transition: background .2s ease; flex-shrink: 0; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 12px; height: 12px; border-radius: 50%; background: rgb(var(--sub)); transition: transform .2s ease, background .2s ease; }
  [aria-checked="true"] .switch { background: rgb(var(--mint) / .35); }
  [aria-checked="true"] .switch::after { transform: translateX(12px); background: rgb(var(--mint)); }

  .progress { height: 1px; background: linear-gradient(90deg, transparent, rgb(var(--mint)), transparent); background-size: 50% 100%; background-repeat: no-repeat; animation: prog 1s linear infinite; }
  @keyframes prog { from { background-position: -50% 0; } to { background-position: 150% 0; } }

  kbd { font-family: "JetBrains Mono", monospace; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body class="font-sans text-[13px]">
<div class="h-full flex flex-col overflow-hidden">

  <!-- ============ HEADER ============ -->
  <header class="relative h-12 shrink-0 flex items-center gap-3 px-4 border-b border-line bg-panel">
    <div class="flex items-center gap-3 min-w-0 shrink-0">
      <div class="flex items-center gap-2">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M5.5 6.5 12 12M18.5 6.5 12 12M12 12v6.5" stroke="rgb(var(--mint))" stroke-opacity=".55" stroke-width="1.5" stroke-linecap="round"/>
          <circle cx="5" cy="6" r="2.1" stroke="rgb(var(--sub))" stroke-width="1.5"/>
          <circle cx="19" cy="6" r="2.1" stroke="rgb(var(--sub))" stroke-width="1.5"/>
          <circle cx="12" cy="19.5" r="2.1" stroke="rgb(var(--sub))" stroke-width="1.5"/>
          <circle cx="12" cy="12" r="2.8" fill="rgb(var(--mint))"/>
        </svg>
        <span class="font-semibold tracking-tight text-[14px]">Tracex</span>
      </div>
      <span class="hidden sm:flex items-center gap-1.5 h-7 px-2.5 rounded-md border border-line font-mono text-[11px] text-sub">
        payment-service-core<span class="text-muted">/</span><span class="text-ink/80">main</span>
      </span>
    </div>

    <!-- spotlight -->
    <div class="flex-1 flex justify-center min-w-0">
      <div class="relative w-full max-w-[580px]">
        <label class="flex items-center gap-2.5 h-8 pl-3 pr-1 rounded-lg border border-line bg-bg/60 focus-within:border-mint/40 transition-colors">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="rgb(var(--muted))" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <span class="sr-only">Search the codebase</span>
          <input id="q" type="text" spellcheck="false" autocomplete="off"
            class="flex-1 min-w-0 bg-transparent outline-none text-ink text-[13px] placeholder:text-muted"
            placeholder="Ask anything or type a symbol…">
          <button id="filterBtn" type="button" aria-haspopup="true" aria-expanded="false" title="Retrieval pillars"
            class="flex items-center gap-1.5 h-6 px-2 rounded-md text-muted hover:text-ink hover:bg-card transition-colors">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
            <span id="pillarDots" class="flex items-center gap-[3px]"></span>
          </button>
          <kbd class="hidden md:inline-flex items-center h-6 px-1.5 rounded-md border border-line text-[10.5px] text-muted">⌘K</kbd>
        </label>

        <!-- filter popover -->
        <div id="filterPop" class="pop glass absolute right-0 top-10 z-30 w-[300px] rounded-xl border border-line shadow-2xl shadow-black/40 p-2" role="dialog" aria-label="Retrieval pillars" data-open="false">
          <div class="px-2 pt-1.5 pb-2 text-[10.5px] font-medium uppercase tracking-[.08em] text-muted">Retrieval pillars</div>
          <div id="filterList" class="flex flex-col"></div>
          <div class="px-2 pt-2 pb-1 text-[11px] text-muted border-t border-line mt-1">Results fuse with Reciprocal Rank Fusion (k = 5).</div>
        </div>
      </div>
    </div>

    <!-- right cluster -->
    <div class="flex items-center gap-1.5 shrink-0">
      <span class="hidden lg:flex items-center gap-1 text-[10.5px] text-muted mr-1" aria-hidden="true">
        <kbd class="h-5 min-w-5 px-1 inline-flex items-center justify-center rounded border border-line">[</kbd>
        <kbd class="h-5 min-w-5 px-1 inline-flex items-center justify-center rounded border border-line">]</kbd>
        <span class="ml-0.5">panels</span>
      </span>
      <button id="themeBtn" type="button" aria-label="Toggle theme" class="w-8 h-8 inline-flex items-center justify-center rounded-md text-sub hover:text-ink hover:bg-card transition-colors">
        <svg id="iconMoon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
        <svg id="iconSun" class="hidden" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
    <div id="progress" class="absolute left-0 right-0 -bottom-px progress hidden"></div>
  </header>

  <!-- ============ BODY ============ -->
  <div class="flex-1 min-h-0 flex">

    <!-- LEFT: search stream -->
    <aside id="left" class="side relative shrink-0 border-r border-line bg-panel overflow-hidden" style="width:300px" data-open="true" aria-label="Search results">
      <div class="full absolute inset-y-0 left-0 w-[300px] flex flex-col">
        <div class="h-11 shrink-0 flex items-center gap-2 pl-4 pr-2">
          <span class="text-[11px] font-medium uppercase tracking-[.08em] text-muted">Results</span>
          <span id="hitCount" class="text-[11px] text-muted font-mono"></span>
          <span class="flex-1"></span>
          <button type="button" data-toggle="left" aria-label="Collapse results ( [ )" title="Collapse  [" class="w-7 h-7 inline-flex items-center justify-center rounded-md text-muted hover:text-ink hover:bg-card transition-colors">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>
          </button>
        </div>
        <p id="activeQuery" class="px-4 pb-3 text-[12.5px] leading-relaxed text-sub"></p>
        <div id="hits" class="scroll flex-1 min-h-0 overflow-y-auto pb-4" role="list"></div>
      </div>
      <div class="rail absolute inset-y-0 left-0 w-11 flex flex-col items-center pt-2 gap-3">
        <button type="button" data-toggle="left" aria-label="Expand results ( [ )" title="Expand  [" class="w-8 h-8 inline-flex items-center justify-center rounded-md text-muted hover:text-ink hover:bg-card transition-colors">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
        </button>
        <span class="text-[10.5px] tracking-[.12em] uppercase text-muted [writing-mode:vertical-rl] rotate-180">Results</span>
      </div>
    </aside>

    <!-- CENTER: code focus -->
    <main class="relative flex-1 min-w-0 flex flex-col bg-bg">
      <div class="h-11 shrink-0 flex items-center gap-3 px-5 border-b border-line">
        <nav id="crumbs" aria-label="Symbol path" class="flex-1 min-w-0 flex items-center gap-1.5 font-mono text-[12px] truncate"></nav>
        <span id="rangeLbl" class="font-mono text-[11px] text-muted whitespace-nowrap"></span>
      </div>
      <div id="codeScroll" class="code-wrap scroll relative flex-1 min-h-0 overflow-auto">
        <div id="codeInner" class="relative min-w-max pt-6 pb-40 font-mono text-[12.5px]">
          <div id="band" class="hl-band"></div>
          <div id="codeLines"></div>
          <!-- floating hover pill -->
          <div id="pill" class="hover-pill glass absolute z-10 left-[84px] flex items-center gap-0.5 p-1 rounded-full border border-line shadow-xl shadow-black/30" role="toolbar" aria-label="Symbol actions">
            <button type="button" data-act="copy" class="h-7 px-3 inline-flex items-center gap-1.5 rounded-full text-[11.5px] text-sub hover:text-ink hover:bg-card transition-colors">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>Copy Link
            </button>
            <button type="button" data-act="callers" class="h-7 px-3 inline-flex items-center gap-1.5 rounded-full text-[11.5px] text-sub hover:text-ink hover:bg-card transition-colors">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="18" r="2.5"/><circle cx="5" cy="5" r="2.5"/><circle cx="19" cy="5" r="2.5"/><path d="M6.5 7 11 15.5M17.5 7 13 15.5"/></svg>Find Callers
            </button>
            <button type="button" data-act="graph" class="h-7 px-3 inline-flex items-center gap-1.5 rounded-full text-[11.5px] text-sub hover:text-ink hover:bg-card transition-colors">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.3 11 15.7 7M8.3 13l7.4 4"/></svg>Open Graph
            </button>
          </div>
        </div>
      </div>
      <div id="toast" role="status" class="pop glass absolute left-1/2 -translate-x-1/2 bottom-5 z-20 px-3.5 py-2 rounded-lg border border-line font-mono text-[11.5px] text-ink shadow-xl shadow-black/30" data-open="false"></div>
    </main>

    <!-- RIGHT: graph + deps -->
    <aside id="right" class="side relative shrink-0 border-l border-line bg-panel overflow-hidden" style="width:360px" data-open="true" aria-label="Call graph and dependencies">
      <div class="full absolute inset-y-0 right-0 w-[360px] flex flex-col">
        <div class="h-11 shrink-0 flex items-center gap-2 pl-2 pr-3 border-b border-line">
          <button type="button" data-toggle="right" aria-label="Collapse graph panel ( ] )" title="Collapse  ]" class="w-7 h-7 inline-flex items-center justify-center rounded-md text-muted hover:text-ink hover:bg-card transition-colors">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
          </button>
          <div role="tablist" aria-label="Graph views" class="flex items-center p-0.5 rounded-lg bg-bg border border-line">
            <button type="button" role="tab" data-tab="graph" class="tab h-7 px-3 rounded-md text-[12px] transition-colors">Topology Graph</button>
            <button type="button" role="tab" data-tab="deps" class="tab h-7 px-3 rounded-md text-[12px] transition-colors">Dependencies &amp; Imports</button>
          </div>
        </div>
        <div class="scroll flex-1 min-h-0 overflow-y-auto">
          <section id="tab-graph" role="tabpanel" aria-label="Topology Graph" class="px-4 pt-4 pb-6">
            <div id="graph" class="rounded-xl border border-line bg-bg/50 bg-[radial-gradient(rgb(var(--line))_1px,transparent_1px)] [background-size:18px_18px]"></div>

      </div>
      <div class="rail absolute inset-y-0 right-0 w-11 flex flex-col items-center pt-2 gap-3">
        <button type="button" data-toggle="right" aria-label="Expand graph panel ( ] )" title="Expand  ]" class="w-8 h-8 inline-flex items-center justify-center rounded-md text-muted hover:text-ink hover:bg-card transition-colors">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>
        </button>
        <span class="text-[10.5px] tracking-[.12em] uppercase text-muted [writing-mode:vertical-rl]">Graph</span>

    <button id="statusBtn" type="button" aria-haspopup="true" aria-expanded="false" class="h-6 px-2 inline-flex items-center gap-2 rounded-md font-mono text-[11px] text-sub hover:text-ink hover:bg-card transition-colors">
      <span class="w-1.5 h-1.5 rounded-full bg-mint breathe"></span>
      Index Ready <span class="text-muted">•</span> main <span class="text-muted">(a3f9c21)</span>
    </button>
    <span class="flex-1"></span>
    <span class="font-mono text-[11px] text-muted">Python 3.12</span>

    <div id="telePop" class="pop glass absolute left-3 bottom-9 z-30 w-[340px] rounded-xl border border-line shadow-2xl shadow-black/40" role="dialog" aria-label="Index telemetry" data-open="false"></div>
  </footer>
</div>

<script>
(function () {
  'use strict';

    document.querySelectorAll('.code-line').forEach((el) => {
      const n = +el.dataset.n;
      const on = n >= r[0] && n <= r[1];
      el.classList.toggle('on', on);
      el.classList.toggle('trace', on && traced);
    });

    const i0 = r[0] - S.start;
    const top = PAD_TOP + i0 * LINE_H;
    const band = $('#band');
    band.style.top = (top - 2) + 'px';
    band.style.height = ((r[1] - r[0] + 1) * LINE_H + 4) + 'px';
    band.classList.toggle('trace', traced);

    const pill = $('#pill');
    let pTop = top - 44;
    if (pTop < 4) pTop = top + (r[1] - r[0] + 1) * LINE_H + 10;
    pill.style.top = pTop + 'px';
    pill.classList.add('peek');
    clearTimeout(renderCode._p);
    renderCode._p = setTimeout(() => pill.classList.remove('peek'), 1600);

    const sc = $('#codeScroll');
    const target = Math.max(0, top - 140);
    sc.scrollTo({ top: target, behavior: smooth ? 'smooth' : 'auto' });
  }

  /* ------------------------------------------------------------------ render: graph */
  function renderGraph() {
    const S = SYMS[state.focusId];
    const W = 328, H = 356;
    const fw = 204, fh = 54, fx = (W - fw) / 2, fy = 152;
    const row = (arr, y, pre) => {
      const n = arr.length, gap = 12;
      const w = Math.min(176, (W - 24 - gap * (n - 1)) / n);
      const tot = n * w + gap * (n - 1);
      const x0 = (W - tot) / 2;
      return arr.map((nd, i) => ({ nd, key: pre + i, i, n, x: x0 + i * (w + gap), y, w, h: 46 }));
    };
    const ups = row(S.callers, 44, 'c');
    const downs = row(S.deps, 266, 'd');
    const clip = (s, w) => { const max = Math.floor((w - 22) / 6.95); return s.length > max ? s.slice(0, max - 1) + '…' : s; };

    let edges = '', nodes = '';
    const eCls = (key) => state.sel === key ? 'trace' : (state.sel === 'f' ? 'on' : '');
    ups.forEach((g) => {
      const sx = g.x + g.w / 2, sy = g.y + g.h, ex = fx + fw * (g.i + 1) / (g.n + 1), ey = fy;
      const c = eCls(g.key);
      edges += '<path class="edge ' + c + '" d="M' + sx + ' ' + sy + ' C' + sx + ' ' + (sy + 44) + ' ' + ex + ' ' + (ey - 44) + ' ' + ex + ' ' + ey + '"/>' +
               '<circle class="edge-dot ' + c + '" cx="' + ex + '" cy="' + ey + '" r="2.4"/>';
    });
    downs.forEach((g) => {
      const sx = fx + fw * (g.i + 1) / (g.n + 1), sy = fy + fh, ex = g.x + g.w / 2, ey = g.y;
      const c = eCls(g.key);
      edges += '<path class="edge ' + c + '" d="M' + sx + ' ' + sy + ' C' + sx + ' ' + (sy + 44) + ' ' + ex + ' ' + (ey - 44) + ' ' + ex + ' ' + ey + '"/>' +
               '<circle class="edge-dot ' + c + '" cx="' + ex + '" cy="' + ey + '" r="2.4"/>';
    });
    const nodeSvg = (key, x, y, w, h, label, sub, cls, aria) =>
      '<g class="gnode ' + cls + '" data-key="' + key + '" tabindex="0" role="button" aria-label="' + esc(aria) + '" aria-pressed="' + (state.sel === key) + '">' +
        '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="10"' + (cls.indexOf('focus') >= 0 ? ' filter="url(#glow)"' : '') + '/>' +
        '<text class="lbl" x="' + (x + 12) + '" y="' + (y + h / 2 - 3) + '">' + esc(clip(label, w)) + '</text>' +
        '<text class="sub" x="' + (x + 12) + '" y="' + (y + h / 2 + 12) + '">' + esc(clip(sub, w)) + '</text>' +
      '</g>';
    ups.concat(downs).forEach((g) => {
      const cls = (state.sel === g.key ? 'sel ' : '') + (g.nd.ext ? 'ext' : '');
      nodes += nodeSvg(g.key, g.x, g.y, g.w, g.h, g.nd.label, g.nd.file, cls, (g.key[0] === 'c' ? 'Caller ' : 'Callee ') + g.nd.label);
    });
    nodes += nodeSvg('f', fx, fy, fw, fh, S.short, base(S.file) + ':' + S.def, 'focus', 'Focus ' + S.short);

    $('#graph').innerHTML =
      '<svg class="graph-fade block w-full h-auto" viewBox="0 0 ' + W + ' ' + H + '" role="group" aria-label="Call graph around ' + esc(S.short) + '">' +
        '<defs><filter id="glow" x="-30%" y="-60%" width="160%" height="220%"><feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="rgb(16,185,129)" flood-opacity=".35"/></filter></defs>' +
        '<text x="14" y="28" style="font: 500 10px Inter, sans-serif; letter-spacing:.08em; fill: rgb(var(--muted))">CALLERS · ' + S.callers.length + ' of ' + S.fanIn + '</text>' +
        '<text x="14" y="250" style="font: 500 10px Inter, sans-serif; letter-spacing:.08em; fill: rgb(var(--muted))">CALLEES · ' + S.deps.length + ' of ' + S.fanOut + '</text>' +
        edges + nodes +
      '</svg>';

    renderNodeCard();
  }

  function nodeInfo() {
    const S = SYMS[state.focusId];
    const nd = nodeFor(S, state.sel);
    if (!nd) return { title: S.qual, kind: S.kind, file: S.file, inN: S.fanIn, outN: S.fanOut, rel: 'Focus', target: null };
    const T = nd.target ? SYMS[nd.target] : null;
    return {
      title: T ? T.qual : nd.label, kind: T ? T.kind : (nd.kind || 'symbol'), file: T ? T.file : nd.file,
      inN: T ? T.fanIn : nd.fanIn || 0, outN: T ? T.fanOut : nd.fanOut || 0,
      rel: state.sel[0] === 'c' ? 'Caller' : 'Callee', target: T ? nd.target : null
    };
  }

  function renderNodeCard() {
    const i = nodeInfo();
    const r = currentRange();
    $('#nodeCard').innerHTML =
      '<div class="rounded-xl border border-line p-4">' +
        '<div class="flex items-center gap-2 text-[11px] text-muted"><span class="uppercase tracking-[.08em]">' + i.rel + '</span><span>·</span><span>' + esc(i.kind) + '</span></div>' +
        '<div class="mt-1.5 font-mono text-[13px] font-medium text-ink break-all">' + esc(i.title) + '</div>' +
        '<div class="mt-0.5 font-mono text-[11px] text-muted break-all">' + esc(i.file) + '</div>' +
        '<div class="mt-3 flex items-center gap-5 text-[11.5px] text-sub">' +
          '<span><span class="font-mono text-ink">' + i.inN + '</span> in</span>' +
          '<span><span class="font-mono text-ink">' + i.outN + '</span> out</span>' +
          '<span class="ml-auto font-mono text-muted">' + rangeText(r) + '</span>' +
        '</div>' +
        (i.target ? '<button type="button" data-open="' + i.target + '" class="mt-3 w-full h-8 inline-flex items-center justify-center gap-1.5 rounded-lg border border-mint/30 text-mint text-[12px] hover:bg-mint/10 transition-colors">Open definition<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>' : '') +
      '</div>';
  }

  /* ------------------------------------------------------------------ render: deps */
  function renderDeps() {
    const S = SYMS[state.focusId];
    const head = (t, n) => '<h3 class="flex items-center gap-2 mb-2 text-[11px] font-medium uppercase tracking-[.08em] text-muted">' + t + (n != null ? '<span class="font-mono normal-case tracking-normal text-muted/70">' + n + '</span>' : '') + '</h3>';
    const table = (rows, pre) =>
      '<div class="rounded-lg border border-line overflow-hidden">' +
        rows.map((nd, i) => {
          const key = pre + i;
          const sel = state.sel === key;
          return '<button type="button" data-key="' + key + '" class="w-full flex items-center gap-3 px-3 h-10 text-left border-b border-line last:border-b-0 transition-colors ' + (sel ? 'bg-trace/10' : 'hover:bg-card/60') + '">' +
            '<span class="flex-1 min-w-0 truncate font-mono text-[12px] ' + (sel ? 'text-ink' : 'text-ink/85') + '">' + esc(nd.label) + '</span>' +
            '<span class="shrink-0 font-mono text-[11px] text-muted">' + esc(nd.loc) + '</span>' +
          '</button>';
        }).join('') +
      '</div>';
    const scope =
      '<div class="rounded-lg border border-line p-3 font-mono text-[11.5px]">' +
        '<div class="text-muted">' + esc(S.file) + '</div>' +
        S.path.map((p, i) => '<div class="text-sub" style="padding-left:' + ((i + 1) * 12) + 'px"><span class="text-muted/60">└ </span>' + esc(p) + '</div>').join('') +
        '<div class="mt-2.5 pt-2.5 border-t border-line grid grid-cols-[84px_1fr] gap-x-3 gap-y-1.5">' +
          S.scope.map((s) => '<span class="text-muted">' + esc(s[0]) + '</span><span class="text-ink/85 break-words">' + s[1].map(esc).join(', ') + '</span>').join('') +
        '</div>' +
      '</div>';
    $('#tab-deps').innerHTML =
      '<section class="mb-6">' + head('Callers', S.callers.length + ' of ' + S.fanIn) + table(S.callers, 'c') + '</section>' +
      '<section class="mb-6">' + head('Callees', S.deps.length + ' of ' + S.fanOut) + table(S.deps, 'd') + '</section>' +
      '<section class="mb-6">' + head('Imports', S.imports.length) +
        (S.imports.length
          ? '<ul class="flex flex-col gap-1">' + S.imports.map((im) => '<li class="truncate font-mono text-[11.5px] text-sub px-3 py-1.5 rounded-md bg-card/50">' + esc(im) + '</li>').join('') + '</ul>'
          : '<p class="text-[12px] text-muted">No module-level imports for this symbol.</p>') +
      '</section>' +
      '<section>' + head('AST scope') + scope + '</section>';
  }

  /* ------------------------------------------------------------------ render: chrome */
  function renderFilters() {
    $('#pillarDots').innerHTML = PILLARS.map((p) =>
      '<span class="w-[5px] h-[5px] rounded-full" style="background:' + (state.retr[p.key] ? 'rgb(' + p.color + ')' : 'rgb(var(--line))') + '"></span>').join('');
    $('#filterList').innerHTML = PILLARS.map((p) => {
      const on = state.retr[p.key];
      return '<button type="button" role="switch" aria-checked="' + on + '" data-pillar="' + p.key + '" class="flex items-center gap-3 px-2 py-2 rounded-lg text-left hover:bg-card transition-colors">' +
        '<span class="w-1.5 h-1.5 rounded-full shrink-0" style="background: rgb(' + p.color + ')"></span>' +
        '<span class="flex-1 min-w-0"><span class="block text-[12.5px] text-ink">' + p.name + '</span><span class="block text-[11px] text-muted">' + p.desc + '</span></span>' +
        '<span class="switch"></span>' +
      '</button>';
    }).join('');
  }

  function renderTelemetry() {
    const L = state.lat;
    const f = fused();
    const top = f.find((x) => x.h.id === state.focusId) || f[0];
    const stages = [['Embeddings', L.emb], ['BM25', L.bm], ['AST traversal', L.ast], ['RRF fusion', L.hybrid ? L.fuse : 0]];
    const maxv = Math.max.apply(null, stages.map((s) => s[1]).concat([1]));
    const row = (k, v) => '<div class="flex items-center justify-between py-1"><span class="text-sub">' + k + '</span><span class="font-mono text-ink">' + v + '</span></div>';
    $('#telePop').innerHTML =
      '<div class="flex items-center justify-between px-4 h-11 border-b border-line">' +
        '<span class="text-[12.5px] font-medium text-ink">Index telemetry</span>' +
        '<button type="button" data-close-tele aria-label="Close telemetry" class="w-7 h-7 inline-flex items-center justify-center rounded-md text-muted hover:text-ink hover:bg-card"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>' +
      '</div>' +
      '<div class="p-4 flex flex-col gap-4 text-[12px]">' +
        '<section><div class="flex items-baseline justify-between mb-2"><span class="text-[10.5px] uppercase tracking-[.08em] text-muted">Retrieval latency</span><span class="font-mono text-mint">' + (L.hybrid ? L.hybrid + 'ms' : 'off') + '</span></div>' +
          stages.map((s) =>
            '<div class="flex items-center gap-3 py-1"><span class="w-24 text-sub">' + s[0] + '</span>' +
            '<span class="flex-1 h-1 rounded-full bg-line overflow-hidden"><span class="block h-full rounded-full bg-mint/70" style="width:' + Math.round(s[1] / maxv * 100) + '%"></span></span>' +
            '<span class="w-11 text-right font-mono text-ink">' + (s[1] ? s[1] + 'ms' : 'off') + '</span></div>').join('') +
        '</section>' +
        '<section class="pt-3 border-t border-line"><div class="text-[10.5px] uppercase tracking-[.08em] text-muted mb-1.5">RRF</div>' +
          row('k', '5') + row('Fused hits', f.length) +
          (top ? row('Active score', top.s.toFixed(2)) + row('Ranks (dense / bm25 / graph)', [top.rk.d, top.rk.b, top.rk.g].map((v, i) => state.retr[PILLARS[i].key] && v ? '#' + v : '—').join(' / ')) : '') +
        '</section>' +
        '<section class="pt-3 border-t border-line"><div class="text-[10.5px] uppercase tracking-[.08em] text-muted mb-1.5">Parsers</div>' +
          row('tree-sitter-python', '0.23.6') + row('tree-sitter-typescript', '0.23.2') + row('tree-sitter-go', '0.23.4') +
        '</section>' +
        '<section class="pt-3 border-t border-line"><div class="text-[10.5px] uppercase tracking-[.08em] text-muted mb-1.5">Index</div>' +
          row('Symbols', '14,820 nodes') + row('Branch', 'main') + row('Commit', 'a3f9c21') +
        '</section>' +
      '</div>';
  }

  function renderPanels() {
    const l = $('#left'), r = $('#right');
    l.dataset.open = state.left; l.style.width = state.left ? '300px' : '44px';
    r.dataset.open = state.right; r.style.width = state.right ? '360px' : '44px';
    document.querySelectorAll('.tab').forEach((t) => {
      const on = t.dataset.tab === state.tab;
      t.setAttribute('aria-selected', on);
      t.className = 'tab h-7 px-3 rounded-md text-[12px] transition-colors ' + (on ? 'bg-card text-ink' : 'text-muted hover:text-ink');
    });
    $('#tab-graph').classList.toggle('hidden', state.tab !== 'graph');
    $('#tab-deps').classList.toggle('hidden', state.tab !== 'deps');
  }

  function renderFocus(smooth) {
    renderCode(smooth);
    renderGraph();
    renderDeps();
  }

  /* ------------------------------------------------------------------ actions */
  function go(id) {
    if (!SYMS[id]) return;
    const sameFile = SYMS[id].code === state.codeKey;
    state.focusId = id; state.sel = 'f';
    renderHits(); renderFocus(sameFile);
  }
  function selectNode(key) {
    state.sel = key;
    renderCode(true); renderGraph(); renderDeps();
  }
  function run() {
    const q = $('#q').value.trim();
    if (!q) return;
    state.active = q; state.loading = true;
    $('#progress').classList.remove('hidden');
    renderHits();
    clearTimeout(run._t);
    run._t = setTimeout(() => {
      state.ranks = rank(q);
      state.lat = lat(q, state.retr);
      state.loading = false;
      $('#progress').classList.add('hidden');
      const f = fused();
      if (f.length) { state.focusId = f[0].h.id; state.sel = 'f'; }
      renderHits(); renderFocus(true); renderTelemetry();
    }, 480);
  }
  function togglePillar(k) {
    state.retr[k] = !state.retr[k];
    state.lat = lat(state.active, state.retr);
    renderFilters(); renderHits(); renderTelemetry();
  }
  function toast(msg) {
    const t = $('#toast');
    t.textContent = msg; t.dataset.open = 'true';
    clearTimeout(toast._t);
    toast._t = setTimeout(() => { t.dataset.open = 'false'; }, 2000);
  }
  function setPop(id, btnId, open) {
    const p = $(id); p.dataset.open = open;
    if (btnId) $(btnId).setAttribute('aria-expanded', open);
  }
  function closePops() { setPop('#filterPop', '#filterBtn', false); setPop('#telePop', '#statusBtn', false); }
  function setTheme(t) {
    document.documentElement.dataset.theme = t;
    $('#iconMoon').classList.toggle('hidden', t === 'light');
    $('#iconSun').classList.toggle('hidden', t !== 'light');
    try { localStorage.setItem('tracex-theme', t); } catch (e) {}
  }

  /* ------------------------------------------------------------------ events */
  $('#q').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); run(); } });

  $('#hits').addEventListener('click', (e) => {
    const b = e.target.closest('.hit'); if (b) go(b.dataset.id);
  });

  $('#graph').addEventListener('click', (e) => {
    const g = e.target.closest('.gnode'); if (g) selectNode(g.dataset.key);
  });
  $('#graph').addEventListener('dblclick', (e) => {
    const g = e.target.closest('.gnode'); if (!g) return;
    const nd = nodeFor(SYMS[state.focusId], g.dataset.key);
    if (nd && nd.target) go(nd.target);
  });
  $('#graph').addEventListener('keydown', (e) => {
    const g = e.target.closest('.gnode');
    if (g && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); selectNode(g.dataset.key); }
  });
  $('#nodeCard').addEventListener('click', (e) => {
    const b = e.target.closest('[data-open]'); if (b) go(b.dataset.open);
  });
  $('#tab-deps').addEventListener('click', (e) => {
    const b = e.target.closest('[data-key]'); if (b) selectNode(b.dataset.key);
  });

  document.querySelectorAll('[data-toggle]').forEach((b) => b.addEventListener('click', () => {
    state[b.dataset.toggle] = !state[b.dataset.toggle]; renderPanels();
  }));
  document.querySelectorAll('.tab').forEach((t) => t.addEventListener('click', () => { state.tab = t.dataset.tab; renderPanels(); }));

  $('#pill').addEventListener('click', (e) => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const S = SYMS[state.focusId], r = currentRange();
    if (b.dataset.act === 'copy') {
      const link = 'tracex://payment-service-core@a3f9c21/' + S.file + '#L' + r[0] + '-L' + r[1];
      try { navigator.clipboard && navigator.clipboard.writeText(link).catch(() => {}); } catch (err) {}
      toast('Link copied · ' + base(S.file) + '#L' + r[0] + '-L' + r[1]);
    } else if (b.dataset.act === 'callers') {
      state.right = true; state.tab = 'deps';
      if (S.callers.length) state.sel = 'c0';
      renderPanels(); renderCode(true); renderGraph(); renderDeps();
      toast(S.fanIn + ' callers · ' + S.callers.length + ' shown');
    } else {
      state.right = true; state.tab = 'graph'; renderPanels();
    }
  });

  $('#filterBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    const open = $('#filterPop').dataset.open !== 'true';
    closePops(); setPop('#filterPop', '#filterBtn', open);
  });
  $('#filterList').addEventListener('click', (e) => {
    const b = e.target.closest('[data-pillar]'); if (b) togglePillar(b.dataset.pillar);
  });
  $('#statusBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    const open = $('#telePop').dataset.open !== 'true';
    closePops(); renderTelemetry(); setPop('#telePop', '#statusBtn', open);
  });
  $('#telePop').addEventListener('click', (e) => {
    if (e.target.closest('[data-close-tele]')) setPop('#telePop', '#statusBtn', false);
  });
  document.addEventListener('click', (e) => {
    if (!e.target.closest('#filterPop') && !e.target.closest('#telePop')) closePops();
  });
  $('#themeBtn').addEventListener('click', () => setTheme(document.documentElement.dataset.theme === 'light' ? 'dark' : 'light'));

  document.addEventListener('keydown', (e) => {
    const typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement && document.activeElement.tagName);
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); $('#q').focus(); $('#q').select(); return; }
    if (e.key === 'Escape') { closePops(); if (typing) $('#q').blur(); return; }
    if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === '[') { state.left = !state.left; renderPanels(); }
    else if (e.key === ']') { state.right = !state.right; renderPanels(); }
    else if (e.key === '/') { e.preventDefault(); $('#q').focus(); }
    else if (e.key === 'j' || e.key === 'k') {
      const f = fused(); if (!f.length) return;
      const i = f.findIndex((x) => x.h.id === state.focusId);
      const n = e.key === 'j' ? Math.min(f.length - 1, i + 1) : Math.max(0, i - 1);
      if (n !== i) go(f[n].h.id);
    }
  });

  /* ------------------------------------------------------------------ boot */
  let saved = null;
  try { saved = localStorage.getItem('tracex-theme'); } catch (e) {}
  setTheme(saved === 'light' ? 'light' : 'dark');
  $('#q').value = DEFAULT_Q;
  state.ranks = rank(DEFAULT_Q);
  state.lat = lat(DEFAULT_Q, state.retr);
  renderPanels(); renderFilters(); renderHits(); renderFocus(false); renderTelemetry();
})();
</script>
</body>
</html>
